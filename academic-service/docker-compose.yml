name: academicDB

services:
  postgres:
    image: postgres:17
    container_name: academic-postgres

    environment:
      POSTGRES_DB: acad_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5433:5432"

    volumes:
      - academic-postgres-data:/var/lib/postgresql/data

volumes:
  academic-postgres-data: